{% extends "base.html" %}

{% block title %}Create Issue | Sprintly{% endblock %}

{% block content %}
<div class="dashboard-page-container" style="max-width:750px;margin:0 auto;">
  
  <div class="view-header" style="margin-bottom:20px;">
    <div class="view-title-group">
      <h1>
        <i data-lucide="plus-circle" style="width:26px;height:26px;color:#4f46e5;"></i>
        <span>Create New Issue</span>
      </h1>
      <div class="view-subtitle">Add a user story, task, bug, or epic to your project workspace.</div>
    </div>
  </div>

  <div class="dash-card">
    <form method="POST" action="{% url 'issues:create' %}">
      {% csrf_token %}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="form-group">
          <label class="form-label">Project *</label>
          <select name="project_id" class="form-control" required>
            {% for p in projects %}
              <option value="{{ p.id }}" {% if project.id == p.id %}selected{% endif %}>{{ p.key }} - {{ p.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Issue Type *</label>
          <select name="issue_type" class="form-control" required>
            <option value="STORY">Story</option>
            <option value="TASK" selected>Task</option>
            <option value="BUG">Bug</option>
            <option value="EPIC">Epic</option>
            <option value="IMPROVEMENT">Improvement</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Issue Title *</label>
        <input type="text" name="title" class="form-control" placeholder="e.g. Implement distributed rate limiter" required>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="4" placeholder="Provide detailed background, steps to reproduce, or acceptance criteria..."></textarea>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select name="priority" class="form-control">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical / Blocker</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Assignee</label>
          <select name="assignee_id" class="form-control">
            <option value="">Unassigned</option>
            {% for u in users %}
              <option value="{{ u.id }}">{{ u.display_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Sprint</label>
          <select name="sprint_id" class="form-control">
            <option value="">Backlog (No Sprint)</option>
            {% for s in sprints %}
              <option value="{{ s.id }}">{{ s.name }} ({{ s.status }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Story Points</label>
          <input type="number" name="story_points" class="form-control" value="3" min="1" max="21">
        </div>

        <div class="form-group">
          <label class="form-label">Due Date</label>
          <input type="date" name="due_date" class="form-control">
        </div>

        <div class="form-group">
          <label class="form-label">Labels</label>
          <input type="text" name="labels" class="form-control" placeholder="api, backend, auth">
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:20px;">
        <a href="{% url 'dashboard:home' %}" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Create Ticket</button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
